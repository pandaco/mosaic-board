<header class="header">
  <div class="header-logo">
    <img src="logo.svg" alt="Mosaic Board Logo" class="logo" />
    <div class="app-title-group">
      <span class="app-name">Mosaic Board</span>
      <span class="app-version">v{{ version }}</span>
    </div>
  </div>
  <nav class="header-actions">
    <button class="add-btn" (click)="openAddModal()">
      <span class="plus">+</span> Add Widget
    </button>
  </nav>
</header>

<main class="dashboard">
  <div class="mosaic-container">
    @if (layoutResource.isLoading()) {
      <div class="loading">Chargement du layout...</div>
    } @else {
      <app-grid
        [widgets]="widgets()"
        (widgetsChange)="onWidgetsChange($event)"
        (deleteWidget)="onDeleteWidget($event)" />
    }
  </div>
</main>

@if (isAddModalOpen()) {
  <div class="modal-overlay" 
       (click)="closeAddModal()" 
       (keydown.enter)="closeAddModal()"
       (keydown.space)="closeAddModal()"
       role="button" 
       tabindex="0"
       aria-label="Close modal">
    <div class="modal-container add-widget-modal" 
         (click)="$event.stopPropagation()"
         (keydown)="$event.stopPropagation()"
         role="dialog"
         aria-modal="true">
      <div class="modal-header">
        <h3 class="modal-title">Add Widget</h3>
        <button class="modal-close" (click)="closeAddModal()" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="widget-selection-grid">
          <button class="widget-type-card" (click)="addWidget('bookmark')">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M20,6h-8l-2-2H4C2.9,4,2.01,4.9,2.01,6L2,18c0,1.1,0.9,2,2,2h16c1.1,0,2-0.9,2-2V8C22,6.9,21.1,6,20,6z M20,18H4V8h16V18z"/>
              </svg>
            </div>
            <span class="card-label">Bookmarks</span>
          </button>
          <button class="widget-type-card" (click)="addWidget('link')">
            <div class="card-icon">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M3.9,12c0-1.71,1.39-3.1,3.1-3.1h4V7H7c-2.76,0-5,2.24-5,5s2.24,5,5,5h4v-1.9H7C5.29,15.1,3.9,13.71,3.9,12z M8,13h8v-2H8V13z M17,7h-4v1.9h4c1.71,0,3.1,1.39,3.1,3.1s-1.39,3.1-3.1,3.1h-4V17h4c2.76,0,5-2.24,5-5S19.76,7,17,7z"/>
              </svg>
            </div>
            <span class="card-label">Bookmark</span>
          </button>
        </div>
      </div>
    </div>
  </div>
}
